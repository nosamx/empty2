name: Build IPA

on:
  push:
    branches:
      - main
      - claude/hiit-app-ipa-uyd7ao
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project HIITTimer.xcodeproj \
            -scheme HIITTimer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HIITTimer.app Payload/
          zip -qry HIITTimer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HIITTimer-ipa
          path: HIITTimer.ipa
