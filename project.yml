name: HIITTimer
options:
  bundleIdPrefix: com.hiittimer
  deploymentTarget:
    iOS: "16.0"
targets:
  HIITTimer:
    type: application
    platform: iOS
    sources:
      - HIITTimer
    info:
      path: HIITTimer/Info.plist
      properties:
        CFBundleDisplayName: HIIT Timer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiittimer.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  HIITTimer:
    build:
      targets:
        HIITTimer: all
